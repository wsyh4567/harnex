<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/harnex-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <title>Harnex — The Living Agent Command Deck</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("harnex.theme") || "light";
          document.documentElement.dataset.theme = t;
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-cyan-500/25">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
